<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f5f8">
<title>OKLCH Palette Picker</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f8;
    --panel: #ffffff;
    --panel-2: #eceef3;
    --line: #d7dae2;
    --text: #1a1c22;
    --muted: #6b6f80;
    --accent: #3b6fe0;
    --radius: 14px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #e9ecf5 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 18px;
    max-width: 1080px;
    margin: 0 auto;
    padding: 22px;
    align-items: start;
  }
  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; gap: 14px; padding: 14px; }
  }

  h1 { font-size: 17px; margin: 0 0 3px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }
  @media (max-width: 780px) {
    .panel { padding: 15px; }
    /* palette first on small screens so a tap on a control shows output nearby */
    .controls { order: 1; }
    .output { order: 2; }
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: var(--panel-2);
    padding: 5px;
    border-radius: 11px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 11px 6px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    border: none;
    background: transparent;
    transition: background .12s, color .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { background: var(--accent); color: #0b1020; }
  .tab:not(.active):active { color: var(--text); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Key swatch */
  .keywrap { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
  .keyswatch {
    width: 66px; height: 66px; border-radius: 12px;
    border: 1px solid rgba(0,0,0,.12);
    flex: 0 0 auto;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .keymeta { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.65; word-break: break-word; }
  .keymeta b { color: var(--text); font-weight: 600; }

  /* Sliders */
  .ctrl { margin-bottom: 17px; }
  .ctrl.hidden { display: none; }
  .ctrl-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 9px;
  }
  .ctrl-head label { font-size: 13px; font-weight: 600; }
  .ctrl-val { font-family: var(--mono); font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 11px; border-radius: 6px;
    background: var(--panel-2); outline: none; margin: 0;
    touch-action: pan-y;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  }
  input[type=range]::-moz-range-track {
    height: 11px; border-radius: 6px; background: transparent;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--panel); cursor: pointer;
    border: 3px solid var(--panel);
    box-shadow: 0 0 0 1px var(--line), 0 1px 4px rgba(0,0,0,.3);
    margin-top: -6px;
  }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--panel); cursor: pointer; border: 3px solid var(--panel);
    box-shadow: 0 0 0 1px var(--line), 0 1px 4px rgba(0,0,0,.3);
  }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent); }

  /* 2D square picker */
  .square {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    margin-bottom: 18px;
    touch-action: none;
    cursor: crosshair;
    -webkit-tap-highlight-color: transparent;
  }
  .square canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; image-rendering: auto;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,.12);
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .sq-lbl {
    position: absolute; z-index: 2; pointer-events: none;
    font: 700 10px/1 var(--mono); letter-spacing: .4px; text-transform: uppercase;
    color: rgba(255,255,255,.9); text-shadow: 0 1px 3px rgba(0,0,0,.7);
  }
  .sq-lbl-x { right: 9px; bottom: 8px; }
  .sq-lbl-y { left: 9px; top: 9px; }
  .sq-marker {
    position: absolute; z-index: 3; width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid #fff; transform: translate(-50%, -50%); pointer-events: none;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.5), 0 2px 7px rgba(0,0,0,.5);
  }
  .square:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Palette */
  .pal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 13px; font-size: 12px; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .select {
    width: 100%; appearance: none; -webkit-appearance: none;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fmt { display: flex; gap: 5px; flex-wrap: wrap; margin: 0 0 14px; }
  .fmt-btn {
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 11px; font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .3px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .fmt-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .fmt-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ΔE legend */
  .legend-toggle {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 600; padding: 14px 2px 0; text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .legend-toggle:hover { color: var(--text); }
  .legend { margin-top: 11px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
  .legend.hidden { display: none; }
  .legend-row { display: flex; align-items: baseline; gap: 12px; font-size: 12px; }
  .legend-band {
    font-family: var(--mono); font-weight: 700; color: var(--accent);
    min-width: 52px; font-variant-numeric: tabular-nums;
  }
  .legend-desc { color: var(--muted); }
  .legend-note { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .stack { display: flex; flex-direction: column; }
  .swatch {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px;
    min-height: 68px;
    cursor: pointer;
    border-radius: 8px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .swatch:first-child { border-top-left-radius: 11px; border-top-right-radius: 11px; }
  .swatch:last-child { border-bottom-left-radius: 11px; border-bottom-right-radius: 11px; }
  .sw-hex {
    font-family: var(--mono); font-size: 15px; font-weight: 700;
    cursor: pointer; padding: 3px 7px; border-radius: 6px;
    letter-spacing: .3px;
  }
  .sw-oklch {
    font-family: var(--mono); font-size: 11px; opacity: .82;
    cursor: pointer; padding: 3px 7px; border-radius: 6px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .sw-hex:active, .sw-oklch:active { background: rgba(0,0,0,.2); }

  .delta {
    display: flex; align-items: center; justify-content: center;
    gap: 7px; height: 22px; color: var(--muted);
    font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
  }
  .delta .bar { flex: 1; height: 1px; background: var(--line); max-width: 90px; }

  /* Single-swatch: big square */
  .stack.single { align-items: center; }
  .stack.single .swatch {
    aspect-ratio: 1 / 1; min-height: 0; width: 100%; max-width: 460px;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    border-radius: 14px;
  }
  .stack.single .sw-hex { font-size: 24px; }
  .stack.single .sw-oklch { font-size: 13px; text-align: center; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: #0b1020; font-weight: 600; font-size: 13px;
    padding: 11px 18px; border-radius: 9px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; z-index: 10;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="app">
  <!-- LEFT: controls -->
  <section class="panel controls">
    <h1>OKLCH Palette Picker</h1>
    <p class="sub">Friendly, always-in-gamut controls over a perceptually-uniform color space.</p>

    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="lightness">Lightness</button>
      <button class="tab" data-mode="hue">Hue</button>
      <button class="tab" data-mode="chroma">Chroma</button>
    </div>

    <div class="keywrap">
      <div class="keyswatch" id="keyswatch"></div>
      <div class="keymeta" id="keymeta"></div>
    </div>

    <div class="square" id="square" tabindex="0" role="slider" aria-label="Color square">
      <canvas id="sq-canvas" width="160" height="160"></canvas>
      <span class="sq-lbl sq-lbl-y" id="sq-lbl-y">L</span>
      <span class="sq-lbl sq-lbl-x" id="sq-lbl-x">C</span>
      <div class="sq-marker" id="sq-marker"></div>
    </div>

    <div class="ctrl">
      <div class="ctrl-head">
        <label for="s-axis" id="axis-label">Hue</label>
        <span class="ctrl-val" id="v-axis">R</span>
      </div>
      <input type="range" id="s-axis" min="0" max="119" step="1" value="0">
    </div>

    <div class="ctrl">
      <div class="ctrl-head">
        <label for="space-select">Gamut</label>
        <span class="ctrl-val" id="v-space">sRGB</span>
      </div>
      <select id="space-select" class="select">
        <option value="srgb">sRGB</option>
        <option value="displayP3">Display P3</option>
        <option value="rec2020">Rec. 2020</option>
      </select>
    </div>

    <div class="ctrl">
      <div class="ctrl-head">
        <label for="s-steps">Steps</label>
        <span class="ctrl-val" id="v-steps">3</span>
      </div>
      <input type="range" id="s-steps" min="1" max="13" step="1" value="3">
    </div>

    <div class="ctrl" id="ctrl-range">
      <div class="ctrl-head">
        <label for="s-range">Range</label>
        <span class="ctrl-val" id="v-range">60</span>
      </div>
      <input type="range" id="s-range" min="0" max="100" step="1" value="60">
    </div>
  </section>

  <!-- RIGHT: palette -->
  <section class="panel output">
    <div class="pal-head">
      <strong id="pal-title">Palette</strong>
      <button class="btn" id="copy-all">Copy all as CSS</button>
    </div>
    <div class="fmt" id="fmt"></div>
    <div class="stack" id="stack"></div>
    <button class="legend-toggle" id="legend-toggle" aria-expanded="false">ΔE scale ▾</button>
    <div class="legend hidden" id="legend">
      <div class="legend-row"><span class="legend-band">&lt; 1</span><span class="legend-desc">Imperceptible</span></div>
      <div class="legend-row"><span class="legend-band">1–2</span><span class="legend-desc">Visible to trained observers</span></div>
      <div class="legend-row"><span class="legend-band">2–10</span><span class="legend-desc">Typical UI color differences</span></div>
      <div class="legend-row"><span class="legend-band">&gt; 10</span><span class="legend-desc">Clearly different colors</span></div>
      <div class="legend-note">ΔE = OKLab distance × 100, shown between adjacent swatches.</div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---- Appendix A: color math ---- */
function srgbDecode(c){ return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function srgbEncode(c){ return c <= 0.0031308 ? 12.92*c : 1.055*Math.pow(c, 1/2.4) - 0.055; }

function linearToOklab(r, g, b){
  const l = 0.4122214708*r + 0.5363325363*g + 0.0514459929*b;
  const m = 0.2119034982*r + 0.6806995451*g + 0.1073969566*b;
  const s = 0.0883024619*r + 0.2817188376*g + 0.6299787005*b;
  const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
  return {
    L: 0.2104542553*l_ + 0.7936177850*m_ - 0.0040720468*s_,
    a: 1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_,
    b: 0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_
  };
}
/* ---- Color-space registry ----
   Each space provides `M`, the OKLab-LMS -> linear-RGB matrix (rows double as
   the per-channel weights the gamut solver needs), plus its CSS color()
   identifier. sRGB uses Ottosson's exact matrix; P3 / Rec.2020 are
   XYZ->RGB · (OKLab LMS->XYZ). Adding a gamut = one more entry here. */
const COLOR_SPACES = {
  srgb: { label: 'sRGB', css: 'srgb', M: [
    [ 4.0767416621, -3.3077115913,  0.2309699292],
    [-1.2684380046,  2.6097574011, -0.3413193965],
    [-0.0041960863, -0.7034186147,  1.7076147010] ] },
  displayP3: { label: 'Display P3', css: 'display-p3', M: [
    [ 3.1281105, -2.2570750,  0.1293048],
    [-1.0911282,  2.4132668, -0.3221682],
    [-0.0260136, -0.5080276,  1.5333167] ] },
  rec2020: { label: 'Rec. 2020', css: 'rec2020', M: [
    [ 2.1401404, -1.2463560,  0.1064317],
    [-0.8848325,  2.1631727, -0.2783616],
    [-0.0485791, -0.4544909,  1.5023563] ] }
};
let activeSpace = 'srgb';
let copyFormat = 'hex';   // primary swatch format: hex | rgb | hsl | space
function curSpace(){ return COLOR_SPACES[activeSpace]; }

// OKLab -> linear RGB in the given (or active) color space.
function oklabToLinear(L, a, b, sp){
  const M = (sp || curSpace()).M;
  const l_ = L + 0.3963377774*a + 0.2158037573*b;
  const m_ = L - 0.1055613458*a - 0.0638541728*b;
  const s_ = L - 0.0894841775*a - 1.2914855480*b;
  const l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
  return {
    r: M[0][0]*l + M[0][1]*m + M[0][2]*s,
    g: M[1][0]*l + M[1][1]*m + M[1][2]*s,
    b: M[2][0]*l + M[2][1]*m + M[2][2]*s
  };
}
const DEG = 180/Math.PI, RAD = Math.PI/180;
function oklabToOklch(L, a, b){
  const C = Math.sqrt(a*a + b*b);
  let H = Math.atan2(b, a) * DEG;
  if (H < 0) H += 360;
  return { L, C, H };
}
function oklchToOklab(L, C, H){ return { L, a: C*Math.cos(H*RAD), b: C*Math.sin(H*RAD) }; }
function oklchToLinear(L, C, H, sp){ const lab = oklchToOklab(L, C, H); return oklabToLinear(lab.L, lab.a, lab.b, sp); }
function hexToOklch(hex){
  hex = hex.replace('#','');
  const r = parseInt(hex.slice(0,2),16)/255, g = parseInt(hex.slice(2,4),16)/255, b = parseInt(hex.slice(4,6),16)/255;
  const lab = linearToOklab(srgbDecode(r), srgbDecode(g), srgbDecode(b));
  return oklabToOklch(lab.L, lab.a, lab.b);
}
function oklchToRgb255(L, C, H){
  const lin = oklchToLinear(L, C, H);
  const to = (v) => Math.round(Math.min(1, Math.max(0, srgbEncode(Math.min(1, Math.max(0, v))))) * 255);
  return { r: to(lin.r), g: to(lin.g), b: to(lin.b) };
}
function oklchToHex(L, C, H){
  const { r, g, b } = oklchToRgb255(L, C, H);
  const hx = (v) => v.toString(16).padStart(2,'0');
  return '#' + hx(r) + hx(g) + hx(b);
}
// Primary CSS color string for the active space: hex for sRGB, else color(...).
function cssColor(c){
  if (activeSpace === 'srgb') return oklchToHex(c.L, c.C, c.H);
  const lin = oklchToLinear(c.L, c.C, c.H); // active-space linear RGB
  const e = (v) => +Math.min(1, Math.max(0, srgbEncode(Math.min(1, Math.max(0, v))))).toFixed(4);
  return `color(${curSpace().css} ${e(lin.r)} ${e(lin.g)} ${e(lin.b)})`;
}
function rgbToHsl(r, g, b){ // r,g,b in 0..1
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0;
  if (d){ if (mx===r) h = ((g-b)/d)%6; else if (mx===g) h = (b-r)/d + 2; else h = (r-g)/d + 4; h *= 60; if (h<0) h += 360; }
  const l = (mx+mn)/2, s = d ? d/(1 - Math.abs(2*l-1)) : 0;
  return { h, s, l };
}
// The swatch's primary string in the currently selected format.
function formatColor(c){
  if (copyFormat === 'rgb'){ const {r,g,b} = oklchToRgb255(c.L,c.C,c.H); return `rgb(${r}, ${g}, ${b})`; }
  if (copyFormat === 'hsl'){ const {r,g,b} = oklchToRgb255(c.L,c.C,c.H); const h = rgbToHsl(r/255,g/255,b/255); return `hsl(${Math.round(h.h)}, ${Math.round(h.s*100)}%, ${Math.round(h.l*100)}%)`; }
  if (copyFormat === 'space') return cssColor(c);
  return oklchToHex(c.L, c.C, c.H);
}
/* ---- Analytical gamut boundary (exact, closed-form, space-agnostic) ----
   At fixed L,H a channel is a cubic in C:  M_row · (L + C·k)^3.  The gamut
   edge is the smallest C>0 where any channel reaches 0 or 1 — solved exactly
   with Cardano, using the active space's matrix. Same math for every gamut. */

// Real roots of a3·x^3 + a2·x^2 + a1·x + a0 (degree-reduces if a3≈0).
function cubicRealRoots(a3, a2, a1, a0){
  const r = [];
  if (Math.abs(a3) < 1e-12){
    if (Math.abs(a2) < 1e-12){ if (Math.abs(a1) > 1e-12) r.push(-a0/a1); return r; }
    const disc = a1*a1 - 4*a2*a0;
    if (disc >= 0){ const sq = Math.sqrt(disc); r.push((-a1+sq)/(2*a2), (-a1-sq)/(2*a2)); }
    return r;
  }
  const b = a2/a3, c = a1/a3, d = a0/a3;
  const p = c - b*b/3, q = 2*b*b*b/27 - b*c/3 + d, shift = -b/3;
  const disc = q*q/4 + p*p*p/27;
  if (disc > 1e-14){
    const sq = Math.sqrt(disc);
    r.push(Math.cbrt(-q/2 + sq) + Math.cbrt(-q/2 - sq) + shift);
  } else if (disc < -1e-14){
    const R = Math.sqrt(-p*p*p/27), phi = Math.acos(Math.max(-1, Math.min(1, -q/2/R))), m = 2*Math.cbrt(R);
    for (let k = 0; k < 3; k++) r.push(m*Math.cos((phi + 2*Math.PI*k)/3) + shift);
  } else {
    const u = Math.cbrt(-q/2); r.push(2*u + shift, -u + shift);
  }
  return r;
}
function smallestPositive(roots, cap){
  let best = cap;
  for (const x of roots) if (x > 1e-9 && x < best) best = x;
  return best;
}
// Max in-gamut chroma at fixed hue H and lightness L, in the active (or given) space.
function Cmax(H, L, sp){
  if (L <= 0 || L >= 1) return 0;
  const M = (sp || curSpace()).M;
  const a = Math.cos(H*RAD), b = Math.sin(H*RAD);
  const kl =  0.3963377774*a + 0.2158037573*b;
  const km = -0.1055613458*a - 0.0638541728*b;
  const ks = -0.0894841775*a - 1.2914855480*b;
  let best = Infinity;
  for (let i = 0; i < 3; i++){
    const wl = M[i][0], wm = M[i][1], ws = M[i][2];
    const a3 = wl*kl*kl*kl + wm*km*km*km + ws*ks*ks*ks;
    const a2 = 3*L*(wl*kl*kl + wm*km*km + ws*ks*ks);
    const a1 = 3*L*L*(wl*kl + wm*km + ws*ks);
    const a0 = L*L*L*(wl + wm + ws);              // channel value at C=0 (= L^3)
    best = smallestPositive(cubicRealRoots(a3, a2, a1, a0),     best); // channel hits 0
    best = smallestPositive(cubicRealRoots(a3, a2, a1, a0 - 1), best); // channel hits 1
  }
  return isFinite(best) ? best : 0;
}
// Clamp toward the neutral axis at fixed L,H until in gamut.
function gamutMap(L, C, H){
  const cm = Cmax(H, L);
  return { L, C: C < cm ? C : cm, H };
}
function deltaEok(c1, c2){
  const a = oklchToOklab(c1.L, c1.C, c1.H), b = oklchToOklab(c2.L, c2.C, c2.H);
  const dL = a.L-b.L, da = a.a-b.a, db = a.b-b.b;
  return Math.sqrt(dL*dL + da*da + db*db);
}

/* ---- Hue anchors / naming ---- */
const ANCHOR_NAMES = ['R','Y','G','C','B','M'];
const HUE_BASE = hexToOklch('#ff0000').H;
const SUBSTEPS = 20;
const STOPS = ANCHOR_NAMES.length * SUBSTEPS;
const DEG_PER_STOP = 360 / STOPS;
function stopToHue(idx){ return ((HUE_BASE + idx * DEG_PER_STOP) % 360 + 360) % 360; }
function stopToName(idx){
  const anchor = Math.floor(idx / SUBSTEPS) % ANCHOR_NAMES.length;
  const sub = idx % SUBSTEPS;
  if (sub === 0) return ANCHOR_NAMES[anchor];
  const next = (anchor + 1) % ANCHOR_NAMES.length;
  return ANCHOR_NAMES[anchor] + (sub * 5) + ANCHOR_NAMES[next];
}

/* ---- State + key color ---- */
const state = { mode:'lightness', hueStop:0, light:63, chromaPct:100, steps:3, range:60 };
function keyColor(){
  const H = stopToHue(state.hueStop);
  const L = state.light / 100;
  const cm = Cmax(H, L);
  const C = (state.chromaPct / 100) * cm;
  return { L, C, H, Cmax: cm };
}

/* ---- Generators ---- */
function genLightness(key, N, range){
  if (N === 1) return [{ L:key.L, C:key.C, H:key.H }];
  const w = range/100;
  let lo = key.L - w/2, hi = key.L + w/2;
  if (lo < 0) { lo = 0; hi = w; }
  else if (hi > 1) { hi = 1; lo = 1 - w; }
  const out = [];
  for (let i = 0; i < N; i++){
    const t = i/(N-1);
    out.push(gamutMap(hi - (hi-lo)*t, key.C, key.H));
  }
  return out;
}
function genHue(key, N, range){
  const spacing = (range/100) * (360/N);
  const out = [];
  for (let i = 0; i < N; i++){ const H = ((key.H + i*spacing)%360 + 360)%360; out.push(gamutMap(key.L, key.C, H)); }
  return out;
}
function genChroma(key, N, range){
  if (N === 1) return [{ L:key.L, C:key.C, H:key.H }];
  const lastC = key.C * (1 - range/100);
  const out = [];
  for (let i = 0; i < N; i++){ const t = i/(N-1); out.push({ L:key.L, C: lastC + (key.C-lastC)*t, H:key.H }); }
  return out;
}
function generate(){
  const key = keyColor(), N = state.steps, range = state.range;
  if (N === 1) return [{ L:key.L, C:key.C, H:key.H }];
  if (state.mode === 'hue') return genHue(key, N, range);
  if (state.mode === 'chroma') return genChroma(key, N, range);
  return genLightness(key, N, range);
}

/* ---- Formatting ---- */
function oklchString(c){ return `oklch(${c.L.toFixed(4)} ${c.C.toFixed(4)} ${c.H.toFixed(2)})`; }
function oklchCss(c){ return `oklch(${(c.L*100).toFixed(2)}% ${c.C.toFixed(4)} ${c.H.toFixed(2)})`; }

/* ---- Axis / square model ----
   In each mode the swept axis is the slider; the two held axes fill the square.
   Square X is horizontal (left = min), Y is vertical (bottom = min, top = max). */
const MODE_CFG = {
  lightness: { slider:'light',  x:'chroma', y:'hue'   },
  hue:       { slider:'hue',    x:'chroma', y:'light' },
  chroma:    { slider:'chroma', x:'hue',    y:'light' }
};
const AXIS_LABEL = { hue:'Hue', light:'Lightness', chroma:'Chroma' };

// axis value as a 0..1 fraction of its own range
function axisFrac(axis){
  if (axis === 'hue')   return state.hueStop / STOPS;
  if (axis === 'light') return state.light / 100;
  return state.chromaPct / 100;
}
function setAxisFrac(axis, f){
  f = Math.min(1, Math.max(0, f));
  if (axis === 'hue')   state.hueStop = Math.round(f * STOPS) % STOPS;
  else if (axis === 'light') state.light = Math.round(f * 100);
  else state.chromaPct = Math.round(f * 100);
}
function axisIntValue(axis){
  if (axis === 'hue') return state.hueStop;
  if (axis === 'light') return state.light;
  return state.chromaPct;
}
function setAxisIntValue(axis, v){
  if (axis === 'hue') state.hueStop = v;
  else if (axis === 'light') state.light = v;
  else state.chromaPct = v;
}
function axisDisplay(axis){
  if (axis === 'hue') return stopToName(state.hueStop);
  if (axis === 'light') return String(state.light);
  return state.chromaPct + '%';
}

/* ---- Rendering ---- */
const el = (id) => document.getElementById(id);
function railGradient(sampler, segments){
  const stops = [];
  for (let i = 0; i <= segments; i++){
    const t = i / segments;
    stops.push(oklchCss(sampler(t)) + ' ' + (t*100).toFixed(1) + '%');
  }
  return `linear-gradient(90deg, ${stops.join(', ')})`;
}
// paint the single adaptive slider's rail for the axis this mode sweeps
function renderRails(){
  const key = keyColor(), axis = MODE_CFG[state.mode].slider;
  let bg;
  if (axis === 'hue')
    // true maximum gamut envelope: each hue at its own max chroma for key.L
    bg = railGradient((t) => { const H = t * 360; return { L: key.L, C: Cmax(H, key.L), H }; }, 24);
  else if (axis === 'light')
    bg = railGradient((t) => gamutMap(t, key.C, key.H), 24);
  else
    // neutral gray -> the true (active-gamut) chroma boundary, smoothly sampled
    bg = railGradient((t) => ({ L: key.L, C: t * Cmax(key.H, key.L), H: key.H }), 24);
  el('s-axis').style.background = bg;
}

// square background: fixed slider axis + X(u) + Y(v). Only changes when the
// slider axis, mode, or active gamut changes; kept out of renderAll().
// Rendered into a display-p3 canvas when supported (so wide-gamut colors show
// truly); pixels are computed in the canvas's own space, chroma extent from
// the active space's Cmax.
const SQ = 160;
let _sqCtx = null, _sqSpace = null, _sqP3 = false;
function sqContext(){
  if (_sqCtx) return _sqCtx;
  let p3 = false;
  try {
    const t = document.createElement('canvas').getContext('2d', { colorSpace: 'display-p3' });
    p3 = !!(t && t.getContextAttributes && t.getContextAttributes().colorSpace === 'display-p3');
  } catch (e) {}
  _sqP3 = p3;
  _sqSpace = p3 ? COLOR_SPACES.displayP3 : COLOR_SPACES.srgb;
  _sqCtx = el('sq-canvas').getContext('2d', p3 ? { colorSpace: 'display-p3' } : undefined);
  return _sqCtx;
}
function renderSquareBg(){
  const cfg = MODE_CFG[state.mode];
  const ctx = sqContext();
  const img = ctx.createImageData(SQ, SQ, _sqP3 ? { colorSpace: 'display-p3' } : undefined);
  const d = img.data;
  const frac = {};
  frac[cfg.slider] = axisFrac(cfg.slider);
  let p = 0;
  for (let py = 0; py < SQ; py++){
    frac[cfg.y] = 1 - py/(SQ-1);
    // when chroma is on X, H & L are constant across the row -> hoist Cmax
    let rowCmax = null;
    if (cfg.x === 'chroma') rowCmax = Cmax(stopToHue(frac.hue * STOPS), frac.light);
    for (let px = 0; px < SQ; px++){
      frac[cfg.x] = px/(SQ-1);
      const H = stopToHue(frac.hue * STOPS), L = frac.light;
      const cm = rowCmax !== null ? rowCmax : Cmax(H, L);          // active-space extent
      const lin = oklchToLinear(L, frac.chroma * cm, H, _sqSpace); // canvas-space color
      d[p++] = Math.round(Math.min(1, Math.max(0, srgbEncode(Math.min(1, Math.max(0, lin.r))))) * 255);
      d[p++] = Math.round(Math.min(1, Math.max(0, srgbEncode(Math.min(1, Math.max(0, lin.g))))) * 255);
      d[p++] = Math.round(Math.min(1, Math.max(0, srgbEncode(Math.min(1, Math.max(0, lin.b))))) * 255);
      d[p++] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}
let sqBgPending = false;
function scheduleSquareBg(){
  if (sqBgPending) return;
  sqBgPending = true;
  requestAnimationFrame(() => { sqBgPending = false; renderSquareBg(); });
}
function positionMarker(){
  const cfg = MODE_CFG[state.mode];
  const m = el('sq-marker');
  m.style.left = (axisFrac(cfg.x) * 100) + '%';
  m.style.top  = ((1 - axisFrac(cfg.y)) * 100) + '%';
  m.style.background = oklchCss(keyColor());
}
function renderSquareLabels(){
  const cfg = MODE_CFG[state.mode];
  el('sq-lbl-x').textContent = AXIS_LABEL[cfg.x];
  el('sq-lbl-y').textContent = AXIS_LABEL[cfg.y];
}
const FMT_LABEL = { hex:'Hex', rgb:'RGB', hsl:'HSL' };
function renderFormatButtons(){
  const fmts = ['hex','rgb','hsl'];
  if (activeSpace !== 'srgb') fmts.push('space'); // color(display-p3 …) / color(rec2020 …)
  if (!fmts.includes(copyFormat)) copyFormat = 'hex';
  const box = el('fmt'); box.innerHTML = '';
  fmts.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'fmt-btn' + (f === copyFormat ? ' active' : '');
    btn.textContent = f === 'space' ? (activeSpace === 'displayP3' ? 'P3' : 'Rec2020') : FMT_LABEL[f];
    btn.onclick = () => { copyFormat = f; renderFormatButtons(); renderPalette(); };
    box.appendChild(btn);
  });
}
function configureSlider(){
  const axis = MODE_CFG[state.mode].slider, s = el('s-axis');
  s.min = 0;
  s.max = axis === 'hue' ? STOPS - 1 : 100;
  s.step = 1;
  s.value = axisIntValue(axis);
}
function renderKey(){
  const key = keyColor();
  el('keyswatch').style.background = oklchCss(key);
  let line3;
  if (activeSpace === 'srgb'){
    const rgb = oklchToRgb255(key.L, key.C, key.H);
    line3 = `${oklchToHex(key.L, key.C, key.H)} · rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
  } else {
    line3 = cssColor(key);
  }
  el('keymeta').innerHTML =
    `<b>${stopToName(state.hueStop)}</b> · ${oklchString(key)}<br>` +
    `hue ${key.H.toFixed(2)}° · Cmax ${key.Cmax.toFixed(4)}<br>` +
    line3;
}
// Black or white overlay text by WCAG contrast ratio on the swatch's relative
// luminance (linear sRGB), not OKLCH L — fixes readability on yellows/cyans.
function contrastText(c){
  const lin = oklchToLinear(c.L, c.C, c.H, COLOR_SPACES.srgb);
  const cl = (v) => Math.min(1, Math.max(0, v));
  const Y = 0.2126*cl(lin.r) + 0.7152*cl(lin.g) + 0.0722*cl(lin.b);
  const contrastVsBlack = (Y + 0.05) / 0.05;
  const contrastVsWhite = 1.05 / (Y + 0.05);
  return contrastVsBlack >= contrastVsWhite ? '#111319' : '#f4f5fb';
}
function renderPalette(){
  const colors = generate(); const stack = el('stack'); stack.innerHTML = '';
  stack.classList.toggle('single', colors.length === 1);
  const showDelta = true;
  colors.forEach((c, i) => {
    const primary = formatColor(c);
    const sw = document.createElement('div');
    sw.className = 'swatch'; sw.style.background = oklchCss(c); sw.style.color = contrastText(c);
    const hexEl = document.createElement('span');
    hexEl.className = 'sw-hex'; hexEl.textContent = primary; hexEl.title = 'Copy';
    hexEl.onclick = (e) => { e.stopPropagation(); copy(primary, 'Copied ' + primary); };
    const okEl = document.createElement('span');
    okEl.className = 'sw-oklch'; okEl.textContent = oklchCss(c); okEl.title = 'Copy oklch()';
    okEl.onclick = (e) => { e.stopPropagation(); copy(oklchCss(c), 'Copied oklch()'); };
    sw.appendChild(hexEl); sw.appendChild(okEl);
    sw.onclick = () => copy(primary, 'Copied ' + primary);
    stack.appendChild(sw);
    if (showDelta && i < colors.length - 1){
      const d = deltaEok(colors[i], colors[i+1]);
      const dRow = document.createElement('div');
      dRow.className = 'delta';
      dRow.innerHTML = `<span class="bar"></span>ΔE ${Math.round(d*100)}<span class="bar"></span>`;
      stack.appendChild(dRow);
    }
  });
}
function renderControls(){
  const axis = MODE_CFG[state.mode].slider;
  el('axis-label').textContent = AXIS_LABEL[axis];
  el('v-axis').textContent = axisDisplay(axis);
  el('s-axis').value = axisIntValue(axis);
  el('v-steps').textContent = state.steps;
  el('v-range').textContent = state.range;
  el('ctrl-range').classList.toggle('hidden', state.steps === 1);
  el('pal-title').textContent = state.mode.charAt(0).toUpperCase() + state.mode.slice(1) + ' palette';
}
function renderAll(){ renderControls(); renderRails(); renderSquareLabels(); positionMarker(); renderKey(); renderPalette(); }

/* ---- Copy ---- */
let toastTimer = null;
function toast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}
function copy(text, msg){
  const done = () => toast(msg || 'Copied');
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta); done();
}
function copyAll(){
  const colors = generate();
  const lines = colors.map((c, i) => `  --color-${i+1}: ${formatColor(c)};`);
  copy(':root {\n' + lines.join('\n') + '\n}', 'Copied ' + colors.length + ' CSS variables');
}

/* ---- Wiring ---- */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.mode = tab.dataset.mode;
    configureSlider();
    renderAll();
    renderSquareBg(); // slider axis changed -> square shows a new pair of axes
  });
});

// the single slider drives whichever axis this mode sweeps
el('s-axis').addEventListener('input', e => {
  setAxisIntValue(MODE_CFG[state.mode].slider, +e.target.value);
  renderAll();
  scheduleSquareBg(); // fixed axis moved -> square background re-tints
});

// the square drives the two held axes; its background does not change on drag
const square = el('square');
let sqDragging = false;
function sqFromEvent(e){
  const r = square.getBoundingClientRect();
  const cfg = MODE_CFG[state.mode];
  setAxisFrac(cfg.x, (e.clientX - r.left) / r.width);
  setAxisFrac(cfg.y, 1 - (e.clientY - r.top) / r.height);
  renderAll();
}
square.addEventListener('pointerdown', e => { sqDragging = true; square.setPointerCapture(e.pointerId); sqFromEvent(e); });
square.addEventListener('pointermove', e => { if (sqDragging) sqFromEvent(e); });
square.addEventListener('pointerup',   () => { sqDragging = false; });
square.addEventListener('pointercancel', () => { sqDragging = false; });
square.addEventListener('keydown', e => {
  const cfg = MODE_CFG[state.mode];
  const nudge = (axis, d) => setAxisFrac(axis, axisFrac(axis) + d);
  const k = e.key;
  if (k === 'ArrowLeft')  nudge(cfg.x, -0.01);
  else if (k === 'ArrowRight') nudge(cfg.x, 0.01);
  else if (k === 'ArrowUp')    nudge(cfg.y, 0.01);
  else if (k === 'ArrowDown')  nudge(cfg.y, -0.01);
  else return;
  e.preventDefault();
  renderAll();
});

el('space-select').addEventListener('change', e => {
  activeSpace = e.target.value;
  el('v-space').textContent = COLOR_SPACES[activeSpace].label;
  renderFormatButtons(); // add/remove the color() option for wide gamuts
  renderAll();
  renderSquareBg(); // gamut envelope changed -> square re-tints
});
el('s-steps').addEventListener('input', e => { state.steps = +e.target.value; renderAll(); });
el('s-range').addEventListener('input', e => { state.range = +e.target.value; renderAll(); });
el('copy-all').addEventListener('click', copyAll);
el('legend-toggle').addEventListener('click', () => {
  const hidden = el('legend').classList.toggle('hidden');
  el('legend-toggle').textContent = 'ΔE scale ' + (hidden ? '▾' : '▴');
  el('legend-toggle').setAttribute('aria-expanded', String(!hidden));
});

configureSlider();
renderFormatButtons();
renderAll();
renderSquareBg();
</script>

</body>
</html>
